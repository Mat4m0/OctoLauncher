name: Build check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies (skip native compile)
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Rebuild native modules for Electron ABI
        run: node_modules/.bin/electron-builder.cmd install-app-deps

      - name: Build bundles
        run: npm run build
        env:
          ELECTRON_RUN_AS_NODE: ''

  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies (stormlib-node is optional and skipped)
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck, build and package the unsigned app
        run: npx tsc && npm run build && npx electron-builder --mac dir --arm64
        env:
          ELECTRON_RUN_AS_NODE: ''
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
