name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies (skip native compile)
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Rebuild native modules for Electron ABI
        run: node_modules/.bin/electron-builder.cmd install-app-deps

      - name: Build and package
        run: npm run dist
        env:
          ELECTRON_RUN_AS_NODE: ''

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OctoLauncher-installer
          path: |
            distprod/OctoLauncher_Installer-*.exe
            distprod/OctoLauncher_Installer-*.exe.blockmap
            distprod/latest.yml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            distprod/OctoLauncher_Installer-*.exe
            distprod/OctoLauncher_Installer-*.exe.blockmap
            distprod/latest.yml
